name: Mac app

# Builds "Scrying Eye.app" on a real Mac, launches it once to check everything starts, and
# publishes the .dmg:
#   - every push to main → downloadable from this workflow run (Actions → Mac app → Artifacts)
#   - a tag like v0.2.0  → a GitHub Release with the .dmg attached (Releases page)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mac:typecheck
      - name: Build the app
        run: npm run mac:dist
      - name: Launch it once (smoke test)
        run: |
          APP="release/mac-arm64/Scrying Eye.app"
          # The whole bundle must be sealed, or a downloaded copy opens as "damaged".
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -5
          "$APP/Contents/MacOS/Scrying Eye" --smoke-test 2>&1 | tee smoke.log &
          PID=$!
          for i in $(seq 1 90); do
            if grep -q '^SMOKE ' smoke.log 2>/dev/null; then break; fi
            sleep 1
          done
          wait $PID || true
          grep '^SMOKE PASS' smoke.log
      # The small update (#64): our code without Electron, and which Electron it was built for.
      - name: Package the small update
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          RES="release/mac-arm64/Scrying Eye.app/Contents/Resources"
          (cd "$RES" && zip -qry "$GITHUB_WORKSPACE/release/Scrying-Eye-$VERSION-arm64-app.zip" app.asar app.asar.unpacked web prompts assets)
          node -e "require('fs').writeFileSync('release/update.json', JSON.stringify({ version: require('./package.json').version, electron: require('electron/package.json').version }) + '\n')"
          cat release/update.json
      - name: Install the small update and launch it (as the app would)
        run: npx tsx scripts/check-update.ts "release/mac-arm64/Scrying Eye.app" release/*-app.zip "$(node -p "require('./package.json').version")"
      - uses: actions/upload-artifact@v4
        with:
          name: Scrying-Eye-mac
          path: |
            release/*.dmg
            release/*.zip
            release/update.json
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*.dmg release/*.zip release/update.json \
            --title "Scrying Eye ${GITHUB_REF_NAME}" \
            --notes "Already have the app (0.4 or later, including when it was called Session Bot)? Use Install Update in its menu. Otherwise: download the .dmg, open it and drag Scrying Eye to Applications. First launch: open it once, then System Settings → Privacy & Security → Open Anyway (see README → Install the Mac app)." \
            || gh release upload "${GITHUB_REF_NAME}" release/*.dmg release/*.zip release/update.json --clobber
