name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The Mac app is built by mac-app.yml; tests don't need the Electron binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, same as the Mac mini this runs on.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The ffmpeg tests use the ffmpeg-static binary npm just installed: apt's ffmpeg took
      # 30 minutes on ubuntu runners. It has libopus and flac, all the tests need.
      - name: Use the bundled ffmpeg
        run: |
          FFMPEG_PATH="$(node -p "require('ffmpeg-static')")"
          VERSION="$("$FFMPEG_PATH" -version)"; echo "${VERSION%%$'\n'*}"
          echo "FFMPEG_PATH=$FFMPEG_PATH" >> "$GITHUB_ENV"
      - run: npm run check:deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run web:typecheck
      - run: npm run web:build
      - run: npm run mac:typecheck
      - run: npm run mac:build-main
