appId: com.reesmcd.sessionbot
productName: Scrying Eye
copyright: Copyright © 2026 Rees McDevitt
directories:
  output: release
  buildResources: electron/assets
files:
  - dist-electron/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: web/dist
    to: web
  - from: prompts
    to: prompts
  - from: electron/assets
    to: assets
    filter: ["tray*.png"]
# Native code and ffmpeg must live outside the asar archive to be executable.
asarUnpack:
  - "**/*.node"
  - node_modules/ffmpeg-static/**
  - node_modules/@snazzah/**
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  icon: electron/assets/icon.png
  # No Apple Developer ID, so sign ad-hoc ("-"). Skipping signing (null) left the bundle unsealed,
  # which macOS reports as "damaged" with no way to open it. Ad-hoc signed, the first launch only
  # needs System Settings → Privacy & Security → Open Anyway.
  # Hardened runtime would reject Electron's own frameworks under an ad-hoc signature.
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    LSUIElement: true
  artifactName: Scrying-Eye-${version}-${arch}-mac.${ext}
dmg:
  title: Scrying Eye
  artifactName: Scrying-Eye-${version}-${arch}.${ext}
publish: null
