# Copy to config.yaml and edit. Every setting is optional; omitted ones use the defaults shown.
# Discord IDs: turn on Developer Mode (User Settings → Advanced), then right-click → Copy ID.
# Secrets (tokens, API keys) never go here; they live in .env.

recording:
  # Never recorded, e.g. your music bot.
  ignore_users: []
  #  - "234395307759108106"
  ignore_bots: true
  # An utterance ends after this much silence.
  silence_ms: 1000
  # Delete local audio this many days after a session is processed (0 = keep forever).
  audio_retention_days: 30

# Names to use in transcripts. Anyone not listed uses their Discord display name.
speakers: {}
#  "123456789012345678": Rees
#  "223456789012345678": Sam
#
#  An account several people share (or one person voicing several roles): list who talks on it and
#  Claude labels each line before writing the recap. The text before " — " is the name used in transcripts.
#  "323456789012345678":
#    name: Rees
#    disambiguate:
#      - "DM — narrates the world and voices NPCs"
#      - "Hamqueef — a player character"

# Campaigns, by the voice channel they're played in: who plays which character, so transcripts show
# character names and the recap can tell the party from NPCs. Easiest to fill in from the app
# (Settings → Campaigns). Real names come from speakers above. Craig imports use the only campaign.
campaigns: {}
#  "345678901234567890":            # voice channel ID
#    name: Curse of Strahd           # the recap's title
#    context: Gothic horror in Barovia. The party is level 5.
#    dndbeyond: 4567890              # optional: the D&D Beyond campaign ID (from its URL)
#    characters:                     # Discord user ID → their character
#      "123456789012345678": { name: DM }
#      "223456789012345678": { name: Thorin, description: dwarf fighter 5, dndbeyond: 98765432 }
#    guests: []                      # people who talk at the table but don't play"

transcription:
  provider: groq              # groq | openai (key in .env: GROQ_API_KEY / OPENAI_API_KEY / TRANSCRIBE_API_KEY)
  # model: whisper-large-v3-turbo   # default per provider; OpenAI needs whisper-1 for timestamps
  # base_url: http://localhost:8000/v1   # any OpenAI-compatible server
  # language: en              # set it if everyone speaks one language: more accurate, no mis-detection
  # prompt: "Names and terms: Rees, Sam, Waterdeep, Strahd."   # helps Whisper spell names right
  batch_minutes: 10
  concurrency: 2
  min_utterance_ms: 400

transcript:
  # Join consecutive lines from one speaker if they paused at most this long.
  merge_gap_seconds: 2
  max_line_seconds: 60
  # timezone: America/New_York   # defaults to the machine's time zone

# The session recap: NPCs, Locations, What happened, Combat (with a kill count), then the extra
# sections listed under include.
summary:
  model: claude-opus-5        # any Claude model ID; claude-sonnet-5 is cheaper
  # low = a few highlights · medium = organised notes · high = thorough, nothing relevant left out
  detail: medium
  cite_timestamps: true       # "[01:23:45]" after each point
  # Extra sections after Combat, in this order.
  include:
    - Loot, rewards and purchases
    - Quests, hooks and open threads
  # Left out even if they match.
  exclude: []
  #  - Rules arguments and out-of-game chat
  # Background Claude should know about every game (per-campaign background goes under campaigns).
  # context: |
  #   Weekly D&D game. Rees is the DM.
  # Steps: raw transcript → clean-up → audit → recap → audit.
  cleanup: true               # Claude fixes misheard names and drops filler first
  cleanup_audit: true         # reverts clean-up edits that changed too much (no API calls)
  recap_audit: true           # Claude checks the recap against the transcript and adds what it missed
  chunk_minutes: 20           # transcript is read in pieces this long
  extract_effort: medium      # low | medium | high | xhigh | max
  synthesize_effort: high
  fallbacks: true             # if Claude declines a request, retry it on Anthropic's recommended fallback model
  # prompts_dir: ./my-prompts # cleanup.md, extract.md, synthesize.md, audit.md, revise.md here override the built-ins

# Send recaps to your wiki (or anything that takes a web request). The key, if it needs one, is
# WIKI_UPLOAD_TOKEN in .env (Settings → Keys in the Mac app), never here.
upload:
  # url: https://wiki.example.com/api/recaps   # empty = uploading off
  method: POST                # POST | PUT
  format: json                # json | markdown (the recap with YAML front matter) | ardent-weave (the Ardent Weave wiki's /api/sessions)
  auth: bearer                # bearer | header (header_name: <key>) | none
  header_name: X-Api-Key
  auto: false                 # upload right after a recording's recap is written
